<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校晓通 Campus Clarity · 说人话</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --ink: #5a5048;
    --ink-light: #a89890;
    --ink-lighter: #c8bdb5;
    --line: #ece2da;
    --rose: #d4a5a5;
  }
  body {
    background: linear-gradient(135deg, #fdf8f5 0%, #f7f2ee 50%, #f5f0eb 100%);
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  .card-soft {
    background: rgba(255, 252, 250, 0.9);
    backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    box-shadow: 0 2px 8px rgba(180, 160, 140, 0.06);
    border-radius: 1.25rem;
  }
  .card-pink { background: rgba(253, 242, 248, 0.7); border: 1px solid rgba(245, 208, 224, 0.6); border-radius: 1.25rem; }
  .card-cream { background: rgba(255, 251, 235, 0.7); border: 1px solid rgba(253, 230, 138, 0.5); border-radius: 1.25rem; }
  .card-lavender { background: rgba(245, 243, 255, 0.7); border: 1px solid rgba(221, 214, 254, 0.6); border-radius: 1.25rem; }
  
  .soft-input, .soft-select {
    background: rgba(255, 252, 250, 0.9);
    border: 1px solid var(--line);
    border-radius: 0.875rem;
    transition: all 0.2s;
  }
  .soft-input:focus, .soft-select:focus {
    background: #ffffff;
    border-color: rgba(212, 165, 165, 0.5);
    box-shadow: 0 0 0 3px rgba(212, 165, 165, 0.08);
    outline: none;
  }
  .btn-primary {
    background: var(--rose);
    color: white;
    border-radius: 0.875rem;
    transition: all 0.2s;
  }
  .btn-primary:hover { background: #c99090; }
  .btn-soft {
    background: #ffffff;
    color: #8a7a72;
    border: 1px solid var(--line);
    border-radius: 0.875rem;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
  }
  .btn-soft:hover { background: #fdf8f5; }
  
  .tab-active { background: #ffffff; box-shadow: 0 1px 3px rgba(180, 160, 140, 0.1); color: var(--ink); }
  .tab-inactive { color: var(--ink-light); }
  .tab-inactive:hover { color: var(--ink); }
  
  .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
  .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(220, 205, 195, 0.5); border-radius: 3px; }
  .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: rgba(200, 180, 170, 0.7); }
  
  .icon { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .icon-lg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }

  /* 移动端适配 */
  @media (max-width: 768px) {
    .h-\[calc\(100vh-140px\)\] { height: auto !important; }
    .card-soft, .card-pink, .card-cream, .card-lavender { border-radius: 1rem; }
    .btn-primary, .btn-soft { padding: 0.75rem 1rem; }
  }
</style>
</head>
<body class="antialiased">

<!-- ========== 顶部日期栏 ========== -->
<div id="topBar" class="max-w-7xl mx-auto px-6 pt-6">
  <div class="flex items-center justify-between flex-wrap gap-3">
    <div class="flex items-center gap-2 text-xs" style="color:var(--ink-light);">
      <svg viewBox="0 0 24 24" class="icon" style="color:var(--rose); width:14px; height:14px;">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span id="todayDate">——</span>
    </div>
    <div class="text-xs" style="color:var(--ink-light);">校晓通向你发来一条邀请～</div>
  </div>
</div>

<!-- ========== 页面1：配置页 ========== -->
<div id="setupPage" class="max-w-xl mx-auto p-6">
  <div class="text-center mb-8 mt-4">
    <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-white shadow-sm mb-4" style="border:1px solid var(--line);">
      <svg viewBox="0 0 24 24" class="icon-lg" style="color:var(--rose); width:24px; height:24px;">
        <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>
        <path d="M14 3v5h5"/>
        <path d="M9 13h6M9 17h4"/>
      </svg>
    </div>
    <h1 class="text-2xl font-semibold tracking-tight" style="color:var(--ink);">校晓通 Campus Clarity</h1>
    <p class="text-sm mt-2" style="color:var(--ink-light);">把校园通知翻译成人话</p >
  </div>

  <div class="card-soft p-6 mb-4">
    <div class="flex items-center gap-2 mb-5">
      <span class="w-1 h-4 rounded-full" style="background:var(--rose);"></span>
      <h2 class="text-sm font-semibold" style="color:var(--ink);">设置你的信息</h2>
    </div>
    <div class="space-y-4">
      <div>
        <label class="text-xs block mb-1.5 font-medium" style="color:var(--ink-light);">身份 <span style="color:#d98c8c;">*</span></label>
        <select id="cfgRole" class="soft-select w-full px-4 py-2.5 text-sm" style="color:var(--ink);">
          <option value="">请选择身份</option>
          <option>普通学生</option>
          <option>学委</option>
          <option>班长</option>
          <option>团支书</option>
        </select>
      </div>
      <div>
        <label class="text-xs block mb-1.5 font-medium" style="color:var(--ink-light);">学院 <span style="color:#d98c8c;">*</span></label>
        <select id="cfgCollege" class="soft-select w-full px-4 py-2.5 text-sm" style="color:var(--ink);">
          <option value="">请选择学院</option>
          <option>国际经济贸易学院</option><option>金融学院</option><option>国际商学院</option>
          <option>法学院</option><option>英语学院</option><option>外语学院</option>
          <option>信息学院</option><option>保险学院</option><option>统计学院</option>
          <option>国际关系学院</option><option>文学与国际传播学院</option><option>马克思主义学院</option>
          <option>国际发展合作学院</option><option>政府管理学院</option><option>体育部</option><option>其他</option>
        </select>
      </div>
      <div>
        <label class="text-xs block mb-1.5 font-medium" style="color:var(--ink-light);">专业 <span style="color:#d98c8c;">*</span></label>
        <input id="cfgMajor" placeholder="如：金融学" class="soft-input w-full px-4 py-2.5 text-sm" style="color:var(--ink);">
      </div>
    </div>
  </div>

  <div class="flex gap-3">
    <button id="enterBtn" class="btn-primary flex-1 py-3 font-medium text-sm">保存并进入</button>
    <button id="resetBtn" class="btn-soft px-5 py-3 text-sm font-medium">重置数据</button>
  </div>
</div>

<!-- ========== 页面2：主功能页 ========== -->
<div id="mainPage" class="max-w-7xl mx-auto p-6 hidden">
  
  <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
    <div class="flex items-center gap-3">
      <div class="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-white shadow-sm" style="border:1px solid var(--line);">
        <svg viewBox="0 0 24 24" class="icon-lg" style="color:var(--rose); width:20px; height:20px;">
          <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>
          <path d="M14 3v5h5"/>
        </svg>
      </div>
      <div>
        <h1 class="text-lg font-semibold tracking-tight" style="color:var(--ink);">校晓通 <span style="color:var(--ink-light); font-weight:normal;">Campus Clarity</span></h1>
        <p class="text-xs mt-0.5" style="color:var(--ink-light);" id="userInfo"></p >
      </div>
    </div>
    <button id="shareBtn" class="btn-soft text-xs px-4 py-2">
      <svg viewBox="0 0 24 24" class="icon" style="width:14px; height:14px;">
        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
      </svg>
      生成分享卡片
    </button>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
    
    <!-- 左侧边栏 -->
    <div class="lg:col-span-4 card-soft p-5 flex flex-col lg:h-[calc(100vh-180px)]">
      <div class="flex gap-1 mb-5 p-1 rounded-xl" style="background:rgba(240, 232, 226, 0.6);">
        <button id="tabFeedBtn" class="flex-1 text-xs py-2 rounded-lg font-medium tab-active transition">聚合流</button>
        <button id="tabCalBtn" class="flex-1 text-xs py-2 rounded-lg font-medium tab-inactive transition">截止日期</button>
        <button id="tabMatBtn" class="flex-1 text-xs py-2 rounded-lg font-medium tab-inactive transition">准备材料</button>
      </div>

      <div class="flex-1 overflow-y-auto pr-1 scrollbar-thin">
        <div id="panelFeed" class="space-y-2">
          <div id="feedEmpty" class="text-center text-xs py-10" style="color:var(--ink-lighter);">暂无通知</div>
          <div id="feedList" class="space-y-2"></div>
        </div>
        
        <div id="panelCalendar" class="hidden space-y-2">
          <div id="calEmpty" class="text-center text-xs py-10" style="color:var(--ink-lighter);">暂无截止日程</div>
          <div id="calList" class="space-y-2"></div>
        </div>
        
        <div id="panelMaterials" class="hidden space-y-2">
          <div id="matEmpty" class="text-center text-xs py-10" style="color:var(--ink-lighter);">暂无材料要求</div>
          <div id="matList" class="space-y-2"></div>
        </div>
      </div>

      <button id="clearAllBtn" class="mt-4 w-full text-xs py-2 rounded-xl transition" style="color:#d98c8c; border:1px solid #f5d0d0;">清空所有历史数据</button>
    </div>

    <!-- 右侧主工作区 -->
    <div class="lg:col-span-8 flex flex-col lg:h-[calc(100vh-180px)] gap-5">
      <div class="card-soft p-5 flex-shrink-0">
        <div class="flex justify-between items-center mb-3 flex-wrap gap-2">
            <div class="flex items-center gap-2">
              <span class="w-1 h-4 rounded-full" style="background:var(--rose);"></span>
              <h2 class="text-sm font-semibold" style="color:var(--ink);">通知原文</h2>
            </div>
            <div class="flex gap-3">
                <button id="fillBtn" class="text-xs underline transition" style="color:var(--ink-lighter);">填入示例</button>
                <button id="clearInputBtn" class="text-xs underline transition" style="color:#d98c8c;">一键清空</button>
            </div>
        </div>
        <textarea id="input" rows="4" placeholder="把学校通知原文粘贴到这里..." class="soft-input w-full p-4 text-sm resize-none"></textarea>
        <button id="translateBtn" class="btn-primary w-full mt-3 py-3 font-medium text-sm">翻译成人话</button>
      </div>

      <div class="card-soft p-5 flex-1 overflow-y-auto scrollbar-thin">
        <div id="resultPlaceholder" class="h-full flex flex-col items-center justify-center text-sm py-12" style="color:var(--ink-lighter);">
            <div class="w-14 h-14 rounded-2xl bg-white flex items-center justify-center mb-3" style="border:1px solid var(--line);">
              <svg viewBox="0 0 24 24" class="icon-lg" style="color:var(--ink-lighter); width:22px; height:22px;">
                <path d="M5 12h14M13 6l6 6-6 6"/>
              </svg>
            </div>
            <p>请在左侧粘贴通知并点击翻译</p >
            <p class="mt-1.5 text-xs" style="color:var(--ink-lighter);">AI 将在下方展示“人话”翻译</p >
        </div>
        <div id="resultContent" class="hidden space-y-4"></div>
      </div>
    </div>

  </div>
</div>

<!-- 分享弹窗 -->
<div id="shareModal" class="fixed inset-0 hidden items-center justify-center p-4 z-50" style="background:rgba(90, 80, 72, 0.3); backdrop-filter:blur(4px);">
  <div class="bg-white rounded-2xl p-5 max-w-md w-full shadow-xl">
    <div class="text-sm font-semibold mb-3" style="color:var(--ink);">分享卡片预览</div>
    <div id="sharePreview" class="text-sm p-4 rounded-xl whitespace-pre-wrap mb-4 max-h-60 overflow-auto scrollbar-thin" style="background:#fdf8f5; color:var(--ink);"></div>
    <div class="flex gap-2">
      <button id="closeShareBtn" class="btn-soft flex-1 py-2.5 text-sm justify-center">关闭</button>
      <button id="copyShareBtn" class="btn-primary flex-1 py-2.5 text-sm justify-center">复制文本</button>
    </div>
  </div>
</div>

<script>
function safeStr(val) {
  if (val === null || val === undefined) return '未明确';
  return String(val);
}

function loadLocalData(key) {
    try {
        var data = JSON.parse(localStorage.getItem(key) || '[]');
        if (!Array.isArray(data)) return [];
        return data.filter(function(item) { return item && typeof item === 'object' && item.task; });
    } catch (e) { return []; }
}

var Icons = {
  pin: '<svg viewBox="0 0 24 24" class="icon" style="color:#c98c8c;"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>',
  check: '<svg viewBox="0 0 24 24" class="icon" style="color:#7dba7d;"><polyline points="20 6 9 17 4 12"/></svg>',
  clock: '<svg viewBox="0 0 24 24" class="icon" style="color:#e8b87d;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
  map: '<svg viewBox="0 0 24 24" class="icon" style="color:#8cafd8;"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
  bulb: '<svg viewBox="0 0 24 24" class="icon" style="color:#d4a55a;"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V18h6v-1.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/></svg>',
  user: '<svg viewBox="0 0 24 24" class="icon" style="color:#9a8ab8;"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>',
  paperclip: '<svg viewBox="0 0 24 24" class="icon" style="color:#a898c8;"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>'
};

window.onload = function() {
  // ★ 显示今天的日期
  var now = new Date();
  var weekdays = ['日','一','二','三','四','五','六'];
  var dateStr = now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日 · 星期' + weekdays[now.getDay()];
  document.getElementById('todayDate').textContent = dateStr;

  window.feedItems = loadLocalData('user_feed');
  window.calendarItems = loadLocalData('user_calendar');
  window.materialsItems = loadLocalData('user_materials');

  document.getElementById('resetBtn').onclick = function() {
      if(confirm("确定要清空所有数据并重置页面吗？")) {
          localStorage.clear();
          location.reload();
      }
  };

  document.getElementById('enterBtn').onclick = function() {
    var role = document.getElementById('cfgRole').value;
    var college = document.getElementById('cfgCollege').value;
    var major = document.getElementById('cfgMajor').value.trim();

    if (!role) { return alert('请选择你的身份！'); }
    if (!college) { return alert('请选择你的学院！'); }
    if (!major) { return alert('请填写你的专业！'); }

    var cfg = { role: role, college: college, major: major };
    window.userConfig = cfg;
    document.getElementById('setupPage').classList.add('hidden');
    document.getElementById('mainPage').classList.remove('hidden');
    document.getElementById('userInfo').textContent = safeStr(cfg.college) + ' · ' + safeStr(cfg.major) + ' · ' + safeStr(cfg.role);
    
    renderAllPanels();
  };

  function switchLeftTab(activeId) {
    document.getElementById('panelFeed').classList.add('hidden');
    document.getElementById('panelCalendar').classList.add('hidden');
    document.getElementById('panelMaterials').classList.add('hidden');
    document.getElementById(activeId).classList.remove('hidden');

    document.getElementById('tabFeedBtn').className = 'flex-1 text-xs py-2 rounded-lg font-medium tab-inactive transition';
    document.getElementById('tabCalBtn').className = 'flex-1 text-xs py-2 rounded-lg font-medium tab-inactive transition';
    document.getElementById('tabMatBtn').className = 'flex-1 text-xs py-2 rounded-lg font-medium tab-inactive transition';

    if (activeId === 'panelFeed') document.getElementById('tabFeedBtn').className = 'flex-1 text-xs py-2 rounded-lg font-medium tab-active transition';
    if (activeId === 'panelCalendar') document.getElementById('tabCalBtn').className = 'flex-1 text-xs py-2 rounded-lg font-medium tab-active transition';
    if (activeId === 'panelMaterials') document.getElementById('tabMatBtn').className = 'flex-1 text-xs py-2 rounded-lg font-medium tab-active transition';
  }

  document.getElementById('tabFeedBtn').onclick = function() { switchLeftTab('panelFeed'); };
  document.getElementById('tabCalBtn').onclick = function() { switchLeftTab('panelCalendar'); };
  document.getElementById('tabMatBtn').onclick = function() { switchLeftTab('panelMaterials'); };

  document.getElementById('translateBtn').onclick = async function() {
    var input = document.getElementById('input').value.trim();
    if (!input) return alert('请粘贴通知');

    var btn = document.getElementById('translateBtn');
    var originalText = btn.textContent;
    btn.textContent = '解析中...';
    btn.disabled = true;

    var controller = new AbortController();
    var timeoutId = setTimeout(function() { controller.abort(); }, 15000);

    try {
      var selectedRole = window.userConfig ? window.userConfig.role : '普通学生';
      var finalRole = '普通学生';
      if (selectedRole !== '普通学生' && input.indexOf(selectedRole) > -1) {
          finalRole = selectedRole;
      }

      var response = await fetch('http://127.0.0.1:8000/api/translate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: input, role: finalRole }),
        signal: controller.signal
      });
      clearTimeout(timeoutId);

      if (!response.ok) throw new Error('后端返回错误状态');
      var result = await response.json();
      if(result.error) throw new Error(result.error + ': ' + (result.detail || ''));

      var hasTask = result.task && result.task.trim() !== '';
      var hasDeadline = result.deadline && result.deadline.trim() !== '';
      var hasSubmitTo = result.submit_to && result.submit_to.trim() !== '';
      var hasSubtext = result.subtext && result.subtext.trim() !== '';
      var hasPersonalAction = result.personal_action && result.personal_action.trim() !== '';
      var materialsList = (result.materials && Array.isArray(result.materials)) ? result.materials.filter(function(m) {
          return m && m.trim() !== '';
      }) : [];
      var hasMaterials = materialsList.length > 0;

      document.getElementById('resultPlaceholder').classList.add('hidden');
      document.getElementById('resultContent').classList.remove('hidden');
      
      var materialsHtml = '';
      if (hasMaterials) {
          materialsHtml = '<div class="mt-4 flex flex-wrap gap-2">';
          for (var i = 0; i < materialsList.length; i++) {
              materialsHtml += '<span class="px-3 py-1 rounded-lg text-xs font-medium inline-flex items-center gap-1.5" style="background:#f5f0fb; color:#8b7aa8; border:1px solid #e8ddf5;">' + Icons.paperclip + safeStr(materialsList[i]) + '</span>';
          }
          materialsHtml += '</div>';
      } else {
          materialsHtml = '<div class="mt-4 text-xs italic flex items-center gap-1.5" style="color:var(--ink-lighter);">' + Icons.paperclip + '无需要准备的材料</div>';
      }

      document.getElementById('resultContent').innerHTML = 
        '<div class="card-pink p-5">' +
          '<div class="flex items-center gap-2 mb-4">' +
            Icons.pin +
            '<span class="text-sm font-semibold" style="color:#a05a5a;">三行摘要</span>' +
          '</div>' +
          '<div class="space-y-3">' +
            '<div class="flex items-start gap-3">' + Icons.check +
              '<div class="text-sm"><span style="color:var(--ink-light);">要做：</span><span class="font-semibold ' + (hasTask ? '' : 'italic') + '" style="color:' + (hasTask ? 'var(--ink)' : 'var(--ink-lighter)') + ';">' + (hasTask ? safeStr(result.task) : '无明确任务') + '</span></div>' +
            '</div>' +
            '<div class="flex items-start gap-3">' + Icons.clock +
              '<div class="text-sm"><span style="color:var(--ink-light);">截止：</span><span class="font-semibold ' + (hasDeadline ? '' : 'italic') + '" style="color:' + (hasDeadline ? '#d98c8c' : 'var(--ink-lighter)') + ';">' + (hasDeadline ? safeStr(result.deadline) : '无截止日期') + '</span></div>' +
            '</div>' +
            '<div class="flex items-start gap-3">' + Icons.map +
              '<div class="text-sm"><span style="color:var(--ink-light);">交给：</span><span class="font-semibold ' + (hasSubmitTo ? '' : 'italic') + '" style="color:' + (hasSubmitTo ? 'var(--ink)' : 'var(--ink-lighter)') + ';">' + (hasSubmitTo ? safeStr(result.submit_to) : '无需提交') + '</span></div>' +
            '</div>' +
          '</div>' +
          materialsHtml +
        '</div>' +

        '<div class="card-cream p-5">' +
          '<div class="flex items-center gap-2 mb-2.5">' + Icons.bulb +
            '<span class="text-sm font-semibold" style="color:#b89050;">潜台词</span>' +
          '</div>' +
          '<div class="text-sm leading-relaxed ' + (hasSubtext ? '' : 'italic') + '" style="color:' + (hasSubtext ? '#7a6a52' : 'var(--ink-lighter)') + ';">' + (hasSubtext ? safeStr(result.subtext) : '无') + '</div>' +
        '</div>' +

        '<div class="card-lavender p-5">' +
          '<div class="flex items-center gap-2 mb-2.5">' + Icons.user +
            '<span class="text-sm font-semibold" style="color:#7a6a9a;">给你的提醒</span>' +
          '</div>' +
          '<div class="text-sm leading-relaxed ' + (hasPersonalAction ? '' : 'italic') + '" style="color:' + (hasPersonalAction ? '#6a5a8a' : 'var(--ink-lighter)') + ';">' + (hasPersonalAction ? safeStr(result.personal_action) : '无特殊提醒') + '</div>' +
        '</div>';

      if (hasTask) {
          addToFeed(input, result.task, hasDeadline ? result.deadline : '未明确', hasSubmitTo ? result.submit_to : '未明确');
          if (hasDeadline) saveToCalendar(result.task, result.deadline, hasSubmitTo ? result.submit_to : '未明确');
          if (hasMaterials) addToMaterials(result.task, materialsList);
      }
      
      renderAllPanels();

    } catch (error) {
      if (error.name === 'AbortError') {
        alert('请求超时！请检查后端是否卡住，或者 DeepSeek API 余额是否充足。');
      } else {
        alert('翻译失败！\n\n错误信息：' + error.message);
      }
    } finally {
      btn.textContent = originalText;
      btn.disabled = false;
    }
  };

  function addToFeed(originalText, task, deadline, submitTo) {
    for (var i = 0; i < window.feedItems.length; i++) {
      if (window.feedItems[i].task === task && window.feedItems[i].deadline === deadline) return; 
    }
    window.feedItems.push({ task: task, deadline: deadline, submit_to: submitTo });
    localStorage.setItem('user_feed', JSON.stringify(window.feedItems));
  }

  function renderFeedList() {
    var list = document.getElementById('feedList');
    var empty = document.getElementById('feedEmpty');
    if (window.feedItems.length === 0) { empty.style.display = 'block'; list.innerHTML = ''; return; }
    empty.style.display = 'none';
    list.innerHTML = '';
    for (var i = window.feedItems.length - 1; i >= 0; i--) {
      var item = window.feedItems[i];
      var card = document.createElement('div');
      card.className = 'rounded-xl p-3.5 cursor-pointer transition';
      card.style.background = 'rgba(255, 252, 250, 0.8)';
      card.style.border = '1px solid rgba(240, 225, 215, 0.9)';
      var deadlineText = (item.deadline && item.deadline !== '未明确') ? item.deadline : '无截止';
      card.innerHTML = '<div class="flex justify-between items-center mb-1"><span class="text-xs font-medium inline-flex items-center gap-1.5" style="color:#d98c8c;">' + Icons.clock + safeStr(deadlineText) + '</span></div><div class="text-sm font-medium" style="color:var(--ink);">' + safeStr(item.task) + '</div><div class="text-xs mt-1 inline-flex items-center gap-1.5" style="color:var(--ink-light);">' + Icons.map + safeStr(item.submit_to) + '</div>';
      card.onclick = function() { alert('任务：' + safeStr(item.task) + '\n截止：' + safeStr(item.deadline) + '\n交给：' + safeStr(item.submit_to)); };
      list.appendChild(card);
    }
  }

  function saveToCalendar(task, deadline, submitTo) {
    if (!deadline || deadline === '未明确' || deadline === '无' || deadline.trim() === '') return;
    var exists = false;
    for (var i = 0; i < window.calendarItems.length; i++) {
      if (window.calendarItems[i].task === task && window.calendarItems[i].deadline === deadline) { exists = true; break; }
    }
    if (!exists) {
      window.calendarItems.push({ task: task, deadline: deadline, submit_to: submitTo, time: Date.now() });
      localStorage.setItem('user_calendar', JSON.stringify(window.calendarItems));
    }
  }

  function renderCalendar() {
    var list = document.getElementById('calList');
    var empty = document.getElementById('calEmpty');
    if (window.calendarItems.length === 0) { empty.style.display = 'block'; list.innerHTML = ''; return; }
    empty.style.display = 'none';
    
    window.calendarItems.sort(function(a, b) { return extractSortKey(a.deadline) - extractSortKey(b.deadline); });
    
    list.innerHTML = '';
    for (var i = 0; i < window.calendarItems.length; i++) {
      var item = window.calendarItems[i];
      var deadlineStr = safeStr(item.deadline);
      var datePart = deadlineStr.split(' ')[0];
      var timePart = deadlineStr.split(' ')[1] || '';
      var div = document.createElement('div');
      div.className = 'rounded-xl p-3.5 flex justify-between items-center cursor-pointer transition';
      div.style.background = 'rgba(255, 250, 250, 0.8)';
      div.style.border = '1px solid rgba(250, 220, 220, 0.8)';
      div.innerHTML = '<div><div class="text-sm font-medium" style="color:var(--ink);">' + safeStr(item.task) + '</div><div class="text-xs mt-1 inline-flex items-center gap-1.5" style="color:var(--ink-light);">' + Icons.map + safeStr(item.submit_to) + '</div></div><div class="text-right"><div class="text-base font-bold" style="color:#d98c8c;">' + datePart + '</div><div class="text-xs font-medium" style="color:var(--ink-light);">' + timePart + '</div></div>';
      div.onclick = function() { alert('任务：' + safeStr(item.task) + '\n截止：' + safeStr(item.deadline)); };
      list.appendChild(div);
    }
  }

  function extractSortKey(deadline) {
    var d = safeStr(deadline);
    if (d.indexOf('未明确') > -1) return 99999;
    var m = d.match(/第(\d+)周/); if (m) return parseInt(m[1]) * 100;
    m = d.match(/(\d+)月(\d+)日/); if (m) return parseInt(m[1]) * 100 + parseInt(m[2]);
    m = d.match(/(\d+)日/); if (m) return parseInt(m[1]);
    return 88888;
  }

  function addToMaterials(task, materialsArr) {
    if (!materialsArr) return;
    if (typeof materialsArr === 'string') materialsArr = [materialsArr];
    if (!Array.isArray(materialsArr) || materialsArr.length === 0) return;

    var cleaned = [];
    for (var i = 0; i < materialsArr.length; i++) {
        var mat = String(materialsArr[i]).trim();
        if (mat && mat !== '未明确' && mat !== '无' && mat !== '[]' && cleaned.indexOf(mat) === -1) {
            cleaned.push(mat);
        }
    }
    if (cleaned.length === 0) return;

    for (var j = 0; j < window.materialsItems.length; j++) {
        if (window.materialsItems[j].task === task) return;
    }
    
    window.materialsItems.push({ task: task, items: cleaned });
    localStorage.setItem('user_materials', JSON.stringify(window.materialsItems));
  }

  function renderMaterialsList() {
    var list = document.getElementById('matList');
    var empty = document.getElementById('matEmpty');
    if (window.materialsItems.length === 0) { empty.style.display = 'block'; list.innerHTML = ''; return; }
    empty.style.display = 'none';
    list.innerHTML = '';
    
    for (var i = window.materialsItems.length - 1; i >= 0; i--) {
      var group = window.materialsItems[i];
      var div = document.createElement('div');
      div.className = 'rounded-xl p-3.5';
      div.style.background = 'rgba(255, 252, 250, 0.8)';
      div.style.border = '1px solid rgba(235, 225, 215, 0.9)';
      div.innerHTML = '<div class="text-xs font-semibold mb-2.5 pb-2 flex items-center gap-1.5" style="color:var(--ink); border-bottom:1px solid rgba(235, 225, 215, 0.9);">' + Icons.paperclip + safeStr(group.task) + '</div><div class="space-y-1.5">' + 
        group.items.map(function(mat) {
            return '<label class="flex items-center gap-2 text-sm cursor-pointer" style="color:var(--ink);"><input type="checkbox" class="rounded" style="accent-color:var(--rose);"><span>' + safeStr(mat) + '</span></label>';
        }).join('') + '</div>';
      list.appendChild(div);
    }
  }

  document.getElementById('clearAllBtn').onclick = function() {
    if (confirm('确定要清空所有历史记录、截止日期和材料清单吗？')) {
      window.feedItems = []; window.calendarItems = []; window.materialsItems = [];
      localStorage.removeItem('user_feed'); localStorage.removeItem('user_calendar'); localStorage.removeItem('user_materials');
      renderAllPanels();
    }
  };

  function renderAllPanels() {
    renderFeedList();
    renderCalendar();
    renderMaterialsList();
  }

  document.getElementById('fillBtn').onclick = function() {
    document.getElementById('input').value = '根据《对外经济贸易大学学生综合素质测评办法》第12条，经研究决定，对2024-2025学年综合素质测评工作作如下调整：请各学院酌情处理，于第8周周五17:00前将汇总表交至学工部302。';
  };

  document.getElementById('clearInputBtn').onclick = function() {
      document.getElementById('input').value = '';
      document.getElementById('input').focus();
  };

  document.getElementById('shareBtn').onclick = function() {
    var trans = document.getElementById('resultContent').innerText || '（还没有翻译内容）';
    var preview = '校晓通 Campus Clarity · 通知翻译卡片\n\n' + trans.slice(0, 300) + '...\n\n—— 来自 ' + (window.userConfig ? window.userConfig.college : '');
    document.getElementById('sharePreview').textContent = preview;
    document.getElementById('shareModal').classList.remove('hidden'); 
    document.getElementById('shareModal').classList.add('flex');
  };
  document.getElementById('closeShareBtn').onclick = function() { document.getElementById('shareModal').classList.add('hidden'); document.getElementById('shareModal').classList.remove('flex'); };
  document.getElementById('copyShareBtn').onclick = function() { navigator.clipboard.writeText(document.getElementById('sharePreview').textContent); alert('已复制到剪贴板'); };
};
</script>
</body>
</html>
